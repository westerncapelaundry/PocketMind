name: Build PocketMind APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore PocketMind source
        shell: bash
        run: |
          cat > /tmp/pocketmind.b64 <<'POCKETMIND_SOURCE'

POCKETMIND_SOURCE
          base64 -d /tmp/pocketmind.b64 > /tmp/pocketmind.tar.gz
