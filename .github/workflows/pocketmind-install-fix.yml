name: PocketMind INSTALL FIX

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore project from existing clean workflow
        shell: python
        run: |
          import base64, gzip, io, pathlib, re, tarfile
          workflow = pathlib.Path('.github/workflows/build-pocketmind-clean-install.yml').read_text()
          match = re.search(r"POCKETMIND_SOURCE'\n(.*?)\n\s*POCKETMIND_SOURCE", workflow, re.S)
          if not match:
              raise SystemExit('Embedded PocketMind source was not found')
          payload = base64.b64decode(''.join(match.group(1).split()))
          archive = gzip.decompress(payload)
          with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
              tar.extractall('.')

      - name: Create a genuinely fresh install package
        shell: bash
        run: |
          sed -i 's/za.co.pocketmind.gjclean/za.co.pocketmind.gjverified/' app/build.gradle
          sed -i 's/versionCode 100/versionCode 102/' app/build.gradle
          sed -i 's/versionName "1.2-clean-install"/versionName "1.2-verified-install"/' app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        shell: bash
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk'

      - name: Prepare final APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PocketMind-INSTALL-FIX.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketMind-INSTALL-FIX
          path: release/PocketMind-INSTALL-FIX.apk
          if-no-files-found: error
