name: PocketMind SCREEN CAPTURE V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pocketmind-screen-capture-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified source
        shell: python
        run: |
          import base64, gzip, io, tarfile
          payload = ''''''
          archive = gzip.decompress(base64.b64decode(''.join(payload.split())))
          with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
              tar.extractall('.')

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prove blocked accessibility service is absent
        shell: bash
        run: |
          if grep -R "BIND_ACCESSIBILITY_SERVICE" app/src/main/AndroidManifest.xml; then
            echo "Accessibility service is still present" >&2
            exit 1
          fi
          grep -q "foregroundServiceType=\"mediaProjection\"" app/src/main/AndroidManifest.xml

      - name: Build APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare final APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/PocketMind-SCREEN-READER.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketMind-SCREEN-READER
          path: release/PocketMind-SCREEN-READER.apk
          if-no-files-found: error
